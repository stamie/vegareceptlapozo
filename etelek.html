<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Étel feltöltése</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/receptek.js" defer></script>
  </head>
  <body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 sm:p-6 font-sans text-slate-800">

    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl border border-slate-100 p-6 sm:p-8">
      
      <!-- Fejléc -->
      <div class="mb-8 border-b border-slate-100 pb-4">
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Új étel feltöltése</h1>
        <p class="text-sm text-slate-500 mt-1">Add meg a étel adatait és a hozzávalókat a listához.</p>
      </div>

      <form id="receptForm" class="space-y-6">
        
        <!-- Étel Neve -->
        <div>
          <label for="nev" class="block text-sm font-medium text-slate-700 mb-1">Étel neve</label>
          <input 
            type="text" 
            id="nev" 
            placeholder="Pl. Házi márványtorta" 
            required 
            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition text-sm bg-slate-50/50"
          >
        </div>

        <!-- Megjegyzés -->
        <div>
          <label for="megjegyzes" class="block text-sm font-medium text-slate-700 mb-1">Megjegyzés / Leírás</label>
          <textarea 
            id="megjegyzes" 
            rows="3"
            placeholder="Rövid leírás vagy tippek a elkészítéshez..." 
            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition text-sm bg-slate-50/50 resize-none"
          ></textarea>
        </div>

        <div class="hr border-t border-slate-100 my-4"></div>

        <!-- Alapanyagkezelő Szekció -->
        <div class="bg-slate-50/70 p-4 rounded-xl border border-slate-100 space-y-4">
          <h2 class="text-sm font-semibold text-slate-700 uppercase tracking-wider">Hozzávalók kezelése</h2>
          
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <input
              type="text"
              id="alapanyag_kereso"
              placeholder="🔍 Keresés az alapanyagok között..."
              class="w-full px-3.5 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm bg-white"
            >
            <button 
              type="button" 
              id="uj_alapanyag_gomb"
              class="w-full px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium rounded-lg text-sm transition shadow-sm active:scale-98"
            >
              + Új alapanyag hozzáadása
            </button>
          </div>

          <div class="flex flex-col sm:flex-row gap-2">
            <select 
              id="alapanyagok_select" 
              class="flex-1 px-3.5 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm bg-white"
            >
              <option value="">Válasszon alapanyagot</option>
            </select>
            <button 
              type="button" 
              id="alapanyag_hozzadasa"
              class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg text-sm transition shadow-sm active:scale-98"
            >
              Hozzáadás
            </button>
          </div>
        </div>

        <!-- Hozzávalók Táblázat -->
        <div class="overflow-hidden rounded-xl border border-slate-200 shadow-sm">
          <table id="alapanyagok" class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-100 text-slate-600 text-xs font-semibold uppercase tracking-wider border-b border-slate-200">
                <th class="py-3 px-4">Hozzávaló</th>
                <th class="py-3 px-4">Mennyiség</th>
                <th class="py-3 px-4">Egység</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 text-sm text-slate-700">
              <tr class="hover:bg-slate-50 transition">
                
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Végsúly -->
        <div>
          <label for="hany_gramm" class="block text-sm font-medium text-slate-700 mb-1">Hány gramm lett belőle?</label>
          <input
            type="number"
            id="hany_gramm"
            placeholder="Pl. 1200"
            step="1"
            min="0"
            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition text-sm bg-slate-50/50"
          >
        </div>

        <!-- Mentés Gomb -->
        <div class="pt-4">
          <button 
            type="submit" 
            class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-base shadow-lg shadow-emerald-600/20 transition active:scale-98 cursor-pointer"
          >
            Étel mentése
          </button>
        </div>

      </form>
    </div>

  </body>
</html>
