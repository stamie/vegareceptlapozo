<html>
  <head>
    <title>Recept feltöltése</title>
    <script src="./js/load.js"></script>
    <script>
      pendingNode().then(async (isNodeReady) => {
        if (isNodeReady) {
          // A Node.js szerver elérhető, folytathatjuk a feltöltési folyamatot
          console.log("A Node.js szerver elérhető. Folytatjuk a feltöltést.");
          try {
            await import("./js/kategoriak.js");
            await import("./js/receptek.js");
            await import("./js/alapanyag.js");
            await import("./js/load-header.js");
            await import("./js/kereso.js");
          } catch (error) {
            console.error("Hiba történt a modulok betöltése közben:", error);
          }          
        } else {
          console.error("A Node.js szerver nem elérhető.");
        }
      });
    </script>
  </head>
  <body>
    <form id="receptForm">
      <input type="text" id="nev" placeholder="Recept neve" required />
      <br />
      <input
        type="text"
        id="kategoria_kereso"
        placeholder="Keresés az kategoriák között..."
      />

      <button type="button" id="uj_kategoria_gomb">
        Új kategoria hozzáadása
      </button>
      <select id="kategoriak_select" placeholder="Kategória keresése">
        <option value="">Válasszon kategoriát</option>
      </select>
      <button type="button" id="kategoria_hozzadasa">
        Kategória hozzáadása
      </button>
      <table id="kategoriak">
        <thead>
          <tr>
            <td>Kategóriák</td>
           
          </tr>
        </thead>
        <tbody>
          
        </tbody>
      </table>      
      <br />
      <input
        type="text"
        id="alapanyag_kereso"
        placeholder="Keresés az alapanyagok között..."
      />

      <button type="button" id="uj_alapanyag_gomb">
        Új alapanyag hozzáadása
      </button>
      <select id="alapanyagok_select" placeholder="Alapanyag keresése">
        <option value="">Válasszon alapanyagot</option>
      </select>
      <button type="button" id="alapanyag_hozzadasa">
        Alapanyag hozzáadása
      </button>
      <table id="alapanyagok">
        <thead>
          <tr>
            <td>Hozzávaló</td>
        <!-- 
            <td>Mennyiség</td>
            <td>Egység</td>
          -->
          </tr>
        </thead>
        <tbody>
          
        </tbody>
      </table>
      <label for="recept_forrasa">Recept forrása:</label>
      <input type="text" id="recept_forrasa" placeholder="Recept forrása" />
      <label for="recept_link">Recept linkje:</label>
      <input type="text" id="recept_link" placeholder="Recept linkje" />
      <label for="recept">Recept leírása:</label>
      <textarea id="recept" placeholder="Recept leírása"></textarea>
      <button type="button" id="recept_mentese">Mentés</button>
    </form>
  </body>
</html>
