<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Étkezések és ételek kezelése</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
      async function pendingNode() {
        while (1 == 1) {
          try {
            const eredmeny = await fetch(
              "https://node-receptek.onrender.com",
            ).then((response) => response.json());
            if (eredmeny.message == "Hello, World!") {
              return;
            }
            window.location.reload();
          } catch (error) {
            console.log(error);
            return;
          }
        }
      }
      pendingNode();
    </script>
    <script src="./js/menuk.js"></script>
    <script src="./js/receptek.js" defer></script>
  </head>

  <body
    
  >
  <div class="bg-slate-900 text-slate-100 min-h-screen py-10 px-4 sm:px-6 lg:px-8">
    <!-- Fő keret -->
    <div class="max-w-9xl mx-auto space-y-8">
      <!-- Étkezések felvitele szekció -->
      <div
        class="bg-white text-slate-800 rounded-2xl shadow-xl border border-slate-100 p-6 sm:p-8"
      >
        <!-- Fejléc -->
        <div class="mb-6 border-b border-slate-100 pb-4">
          <h1 class="text-2xl font-bold text-slate-900 tracking-tight">
            Étkezések kezelése

          <p class="text-sm text-slate-500 mt-1">
            Napi étkezések megtekintése és összeállítása.

          <!-- ÚJ PDF GOMB -->
          <button
            type="button"

            <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20">
              <path

              />
            </svg>
            PDF Letöltése

        </div>
        <!-- Meglévő menük táblázata -->

      </div>
    </div>
    </div>
    <div class="flex flex-row gap-4 bg-slate-900 text-slate-100 min-h-screen py-10 px-4 sm:px-6 lg:px-8">
    <div class="max-w-4xl space-y-8">
      <div
        class="bg-white text-slate-800 rounded-2xl shadow-xl border border-slate-100 p-6 sm:p-8"
      >
        <div class="mb-6 border-b border-slate-100 pb-4">
          <!-- Új menü felvitele űrlap -->
          <div
            id="menuForm"
            class="space-y-6 bg-slate-50/70 p-5 rounded-xl border border-slate-100"
          >
            <h1
              class="text-sm font-semibold text-slate-700 uppercase tracking-wider"

              Új menü elem hozzáadása

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div>
                <label

              <div>

                      <th class="pb-2">Fogás</th>
                      <th class="pb-2">Mennyiség</th>

                  </thead>
                  <tbody

                  <tbody id="fogas_bevitel">
                    <tr>
                      <td>
                        <input

                        <select

                        </select>
                        <button

            </div>

            <div>
              <button

    </div>
    <div class="max-w-2xl mx-right space-y-8">
      <div
        class="bg-white text-slate-800 rounded-2xl shadow-xl border border-slate-100 p-6 sm:p-8"
      >
      <!-- Új étel feltöltése szekció (A már meglévő szép formád) -->

        class="bg-white text-slate-800 rounded-2xl shadow-xl border border-slate-100 p-6 sm:p-8"
      >
        <!-- Fejléc -->

          <h1 class="text-2xl font-bold text-slate-900 tracking-tight">
            Új étel feltöltése
          </h1>
          <p class="text-sm text-slate-500 mt-1">
            Add meg az étel adatait és a hozzávalókat a listához.
          </p>
        </div>

        <div id="receptForm" class="space-y-6">
          <!-- Étel Neve -->
          <div>
            <label

            <input

              id="nev"

          <!-- Megjegyzés -->

              <button

                Hozzáadás

                  <th class="py-3 px-4">Hozzávaló</th>

                  <th class="py-3 px-4">Egység</th>
                </tr>
              </thead>
              <tbody

          </div>

          <!-- Végsúly -->
          <div>

            <input

              id="hany_gramm"

              required

          </div>

          <!-- Mentés Gomb -->
          <div class="pt-4">
            <button
              type="button"
              id="recept_mentese"
              class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-base shadow-lg shadow-emerald-600/20 transition active:scale-98 cursor-pointer"
            >
              Étel mentése
            </button>
          </div>
        </div>
      </div>
    </div>

  </body>
  <script>
    function downloadPDF() {
      const element = document.getElementById("pdf-content");
      const today = new Date().toISOString().split("T")[0];

      const opt = {
        margin: 10,
        filename: `etkezesek_${today}.pdf`,
        image: { type: "jpeg", quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: "mm", format: "a4", orientation: "landscape" },
      };

      html2pdf().set(opt).from(element).save();
    }
    document.addEventListener("DOMContentLoaded", async () => {
      const menuTabla = document.getElementById("menuk");
      const url = "https://node-receptek.onrender.com/data/menuk";
      let min_date = new Date("2025-10-16").toISOString().split("T")[0];
      const max_date = new Date().toISOString().split("T")[0];
      if (menuTabla) {
        let menukListaja = await fetch(
          url + "?min-date=" + min_date + "&max-date=" + max_date,
          { method: "GET" },
        ).then((response) => response.json());
        let elozoDatum = "";
        if (Array.isArray(menukListaja)) {
          console.log(menukListaja);
          for (let i = 0; menukListaja.length > i; i++) {
            const datum_ = menukListaja[i]["datum"];
            console.log(datum_);
            if (menukListaja[i]["datum"] !== elozoDatum) {
              const thead_ = `<thead>
                <tr class="bg-slate-900 text-white"><th colspan="7"
                    class="py-3 px-4 text-center font-semibold text-base" 
                    data-field="datum" 
                    data-date="${menukListaja[i]["datum"]}">📅 ${menukListaja[i]["datum"]}
                  </th>
                </tr>
                <tr
                  class="bg-slate-100 text-slate-600 text-xs font-semibold uppercase tracking-wider border-b border-slate-200"
                >
                  <th class="py-3 px-4" data-field="etkezes">Étkezés</th>
                  <th class="py-3 px-4" data-field="ido">Időpont</th>
                  <th class="py-3 px-4" data-field="fogasok" colspan="2">
                    Fogások
                  </th>
                  <th class="py-3 px-4" data-field="mennyiseg" colspan="2">Mennyiségek</th>
                  <th class="py-3 px-4" data-field="eszkozok">Eszközök</th>
                </tr>
              </thead>
            `;
              elozoDatum = menukListaja[i]["datum"];
              document.getElementById("menuk").innerHTML += thead_;
            }
            const tbody_ = generateTbody(datum_, menukListaja[i]);
            document.getElementById("menuk").innerHTML += tbody_;
          }
        }
      }
    });
    function generate(recept_osszetevok, evesMennyiseg, evesEgyseg) {
      if (
        Array.isArray(recept_osszetevok["recept"]) &&
        recept_osszetevok["recept"].length > 0
      ) {
        let res_ = {
          "osszetevok":"",
          "evett_mennyisegek": ""
        };
        
        recept_osszetevok["recept"].forEach((element) => {
          if (
            Array.isArray(element["alapanyagok"]) &&
            element["alapanyagok"].length > 0
          ) {
            let mennyisegek_ = [];
            let sumGram = 0;
            for (let i = 0; element["alapanyagok"].length > i; i++) {
              alapanyag_ = element["alapanyagok"][i];
              res_["osszetevok"] +=
                alapanyag_["alapanyag"]["nev"] +
                " " +
                alapanyag_["mennyiseg"] +
                " " +
                alapanyag_["egyseg"] +
                "<br>";
                mennyisegek_[i] = {"osszetevo": alapanyag_["alapanyag"]["nev"], "mennyiseg": parseFloat(alapanyag_["mennyiseg"])};
                if (alapanyag_["egyseg"] == ["kg"]) {
                  mennyisegek_ [i]["mennyiseg"] = mennyisegek_ [i]["mennyiseg"]*1000;
                }
                sumGram += mennyisegek_[i]["mennyiseg"];
              }
            let evesMennyiseg_ = parseFloat(evesMennyiseg);
            if (evesEgyseg == "kg") {
              evesMennyiseg_ = evesMennyiseg_*1000;
            }
            console.log(mennyisegek_); console.log("hello");
            for (let i = 0; mennyisegek_.length > i; i++) {
              console.log("haho beléptem");
              console.log(mennyisegek_[i]);
              const meny_ = mennyisegek_[i]["mennyiseg"] * evesMennyiseg_ / sumGram;

              res_["evett_mennyisegek"] += " ~" + mennyisegek_[i]["osszetevo"] + " " + meny_ + " gramm <br>";

            }
          }
        });
        return res_;
      }
      return res_;
    }
    function generateTbody(datumka, aznapi_menu) {
      console.log(datumka);
      let value_ = "";
      for (let i = 1; aznapi_menu["receptek"].length > i; i++) {
        const mennyisegekEsOsszetevok =generate(aznapi_menu["receptek"][i],aznapi_menu["receptek"][i]["mennyiseg"], aznapi_menu["receptek"][i]["egyseg"]);
        
        value_ += `
              <tr class="hover:bg-slate-50 transition">
                <td class="py-3 px-4" data-field="fogasok">${aznapi_menu["receptek"][i]["recept"][0]["nev"]}</td>
                <td class="py-3 px-4" data-field="osszetevok">${mennyisegekEsOsszetevok["osszetevok"]}</td>
                <td
                  class="py-3 px-4 font-semibold text-emerald-600"
                  data-field="mennyiseg"
                >
                  ${aznapi_menu["receptek"][i]["mennyiseg"]} ${aznapi_menu["receptek"][i]["egyseg"]} 
                </td>
                <td>
                  ${mennyisegekEsOsszetevok["evett_mennyisegek"]}
                </td>
                <td>
                  <button type="button" onclick="fogas_torles(
                  '${aznapi_menu["kod"]}', 
                  '${aznapi_menu["receptek"][i]["recept"][0]["kod"]}', 
                  ${aznapi_menu["receptek"][i]["mennyiseg"]}, 
                  '${aznapi_menu["receptek"][i]["egyseg"]}')"
                  class="bg-red-500 text-white px-3 py-1 rounded-lg hover:bg-red-600">Fogás törlése</button>
                </td>
              </tr>`;
      }
      const mennyisegekEsOsszetevok_ = generate(aznapi_menu["receptek"][0],aznapi_menu["receptek"][0]["mennyiseg"], aznapi_menu["receptek"][0]["egyseg"]);
      console.log(mennyisegekEsOsszetevok_);
      let return_val =
        aznapi_menu["receptek"].length > 0
          ? `<tbody class="divide-y divide-slate-100 text-sm text-slate-700">
              <tr class="hover:bg-slate-50 transition" data-field="reggeli">
                <td
                  class="py-3 px-4 font-medium text-slate-900"
                  data-field="etkezes"
                  rowspan="${aznapi_menu["receptek"].length}"
                >
                  ${aznapi_menu["etkezes"]}
                </td>
                <td
                  class="py-3 px-4 text-slate-500"
                  data-field="ido"
                  rowspan="${aznapi_menu["receptek"].length}"
                >
                  ${aznapi_menu["idopont"]}
                </td>
                <td class="py-3 px-4" data-field="fogasok">${aznapi_menu["receptek"][0]["recept"][0]["nev"]}</td>
                <td class="py-3 px-4" data-field="osszetevok">${mennyisegekEsOsszetevok_["osszetevok"]}</td>
                <td
                  class="py-3 px-4 font-semibold text-emerald-600"
                  data-field="mennyiseg"
                >
                  ${aznapi_menu["receptek"][0]["mennyiseg"]} ${aznapi_menu["receptek"][0]["egyseg"]} 
                </td>
                <td>
                  ${mennyisegekEsOsszetevok_["evett_mennyisegek"]}
                </td>
                <td>
                  <button type="button" onclick="fogas_torles(
                  '${aznapi_menu["kod"]}',
                  '${aznapi_menu["receptek"][0]["recept"][0]["kod"]}',
                  ${aznapi_menu["receptek"][0]["mennyiseg"]},
                  '${aznapi_menu["receptek"][0]["egyseg"]}')"
                  class="bg-red-500 text-white px-3 py-1 rounded-lg hover:bg-red-600">Fogás törlése</button>
                </td>
              </tr>
              ${value_}
              
            </tbody>`
          : "";

      return return_val;
          }
  
  
  async function fogas_torles(etkezes, kod, mennyiseg, egyseg) {
    const url = 'https://node-receptek.onrender.com/data/menuk/del/';
    const formData = {'etkezes': etkezes, 'kod': kod, 'mennyiseg': mennyiseg, 'egyseg': egyseg};
    let del_ = await fetch(url, { method: "POST", body: JSON.stringify(formData),
          headers: {
            "Content-Type": "application/json",
          }, }); console.log(del_.ok);
    if (del_.ok) {
      window.alert('Sikeresen lefutott');
      //window.location.reload();
      return;
    }
    window.alert('hibara futott');
    return;
  }  
  </script>
