<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Receptek Keresése</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Alapértelmezett favicon a böngésző fülekhez -->
    <link rel="icon" href="/img/favicon.ico" sizes="any" />
    <!-- Modern PNG favicon (32x32 px) -->
    <link
      rel="icon"
      href="/img/favicon-32x32.png"
      type="image/png"
      sizes="32x32"
    />
    <!-- Apple Touch Icon iOS eszközökhöz (Főképernyőre mentéskor) -->
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />

    <link rel="stylesheet" href="./css/style-new.css" />
    <link rel="stylesheet" href="./css/modal.css" />
    <!--- <link rel="stylesheet" href="./css/style-1.css" />
    <link rel="stylesheet" href="./css/style-2.css" />
    <link rel="stylesheet" href="./css/style-3.css" /> -->
    <script src="./js/load-header.js"></script>
  </head>
  <body>
    <div class="container">
      <!-- Fejléc -->
      <div id="header-container"></div>
      <!-- Szűrők -->
      <div class="search-card">
        <div class="search-row c1">
          <!-- Recept név keresés -->
          <div class="form-group">
            <label for="kereso_nev">Keresés név alapján</label>
            <input
              type="text"
              id="kereso_nev"
              placeholder="Pl.: Gyümölcsös piskóta..."
            />
          </div>
        </div>
        <div class="search-row c2">
          <div class="form-group">
            <label>Kategória</label>
            <div
              class="custom-multiselect"
              id="ms_kategoria"
              data-placeholder="Összes kategória"
            >
              <div class="multiselect-trigger" tabindex="0">
                <div class="selected-tags">
                  <span class="placeholder">Összes kategória</span>
                </div>
                <span class="arrow">▼</span>
              </div>
              <div class="multiselect-dropdown">
                <input
                  type="text"
                  class="multiselect-search"
                  placeholder="Keresés..."
                />
                <ul class="multiselect-options"></ul>
              </div>
            </div>
          </div>
          <!-- Alapanyag szűrő -->
          <div class="form-group">
            <label>Alapanyag</label>
            <div
              class="custom-multiselect"
              id="ms_alapanyag"
              data-placeholder="Összes alapanyag"
            >
              <div class="multiselect-trigger" tabindex="0">
                <div class="selected-tags">
                  <span class="placeholder">Összes alapanyag</span>
                </div>
                <span class="arrow">▼</span>
              </div>
              <div class="multiselect-dropdown">
                <input
                  type="text"
                  class="multiselect-search"
                  placeholder="Keresés..."
                />
                <ul class="multiselect-options"></ul>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Recept Lista / Grid -->
      <div id="receptek_lista" class="recipes-grid">
        <!-- Ide töltődnek be a kártyák dinamikusan JS segítségével -->
      </div>
    </div>

    <!-- Recept Részletek Modal (Pop-up) -->
    <div id="receptModal" class="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h2 id="modalTitle"></h2>
          <button class="btn-close" id="modalClose">&times;</button>
        </div>
        <div class="tags" id="modalTags"></div>
        <p id="modalSource" class="recipe-source"></p>
        <hr
          style="
            margin-bottom: 16px;
            border: 0;
            border-top: 1px solid var(--border-color);
          "
        />
        <h4>Elkészítés:</h4>
        <p
          id="modalDescription"
          style="white-space: pre-line; line-height: 1.6; margin-top: 8px"
        ></p>
      </div>
    </div>
    <!-- JavaScript fájlok -->
    <script type="module">
      document.addEventListener("DOMContentLoaded", async () => {
        try {
          // 1. Dinamikusan betöltjük a modult
          const module = await import("./js/load.js");

          // 2. Kinyerjük a default exportot (ami a pendingNode függvényünk)

          console.log("load.js sikeresen betöltve.");

          // 3. Meghívhatjuk a függvényt
          const isNodeReady = await module.pendingNode();

          if (isNodeReady.ready) {
            console.log("A szerver elérhető!");
            const keresoJs = await import("./js/kereso.js");
            await keresoJs.loadKereso(); // Meghívjuk a default exportált függvényt
          } else {
            console.log("A szerver nem válaszol.");
          }
        } catch (error) {
          console.error("Hiba történt a betöltés során:", error);
        }
      });
    </script>
  </body>
</html>
